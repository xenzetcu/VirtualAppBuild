name: Build VirtualApp
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Download VirtualApp source
      run: |
        git clone https://github.com/asLody/VirtualApp.git .
    - uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Find and Build
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        cd $(find . -name "gradlew" -printf '%h\n' | head -n 1)
        # Создаем файл gradle.properties с указанием пути к Java
        echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
        ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: VirtualApp-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
